name: Build and Push Docker Image

on:
  push:
    # Trigger the workflow on pushes to the main branches
    branches: [ "master", "main" ]
    # Trigger on version tags (e.g., v0.5, v1.0.1)
    tags: [ 'v*' ]
  pull_request:
    # Build (but don't push) for pull requests to verify the Dockerfile
    branches: [ "master", "main" ]
  schedule:
    # Weekly rebuild (Monday 04:00 UTC) to pick up base image / Debian security patches
    - cron: '0 4 * * 1'
  # Allow manual rebuild from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history + tags needed by git describe for APP_VERSION
          fetch-depth: 0

      - name: Compute APP_VERSION
        # Same scheme as deploy.sh: MAJOR.MINOR from latest vX.Y tag, patch = commits since tag
        id: version
        run: |
          desc=$(git describe --tags --long --match 'v*' 2>/dev/null || echo "v0.0-0-g0000000")
          major_minor=$(echo "$desc" | sed 's/-[0-9]*-g[0-9a-f]*$//' | sed 's/^v//')
          patch=$(echo "$desc" | sed 's/.*-\([0-9]*\)-g[0-9a-f]*$/\1/')
          echo "app_version=${major_minor}.${patch}" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=${major_minor}.${patch}"

      - name: Set up Docker Buildx
        # Configures the advanced Docker build engine
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Skip login if it's just a Pull Request check
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        # Automatically generates tags like :latest and :v1.2.3
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/stream-to-dlna
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          # Always pull the newest base image (security patches)
          pull: true
          # Scheduled/manual runs rebuild from scratch so apt-get upgrade actually runs
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
          # Only push if it's not a pull request
          push: ${{ github.event_name != 'pull_request' }}
          # Removed platforms line to default to linux/amd64 only
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Use GitHub Actions cache for faster subsequent builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub description
        if: github.event_name != 'pull_request'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/stream-to-dlna
          readme-filepath: ./DOCKER_HUB.md